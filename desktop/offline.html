<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAC-EL</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D2660;color:#fff;font-family:system-ui,Segoe UI,sans-serif;text-align:center;padding:24px}
  h1{font-size:22px;margin:0 0 8px}p{opacity:.8;margin:0 0 20px;max-width:34ch}
  button{padding:12px 24px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
</style></head>
<body><div>
  <h1>Can't reach TAC-EL</h1>
  <p id="msg">Check your internet connection. The app will open again as soon as you are back online.</p>
  <button id="retry">Try again</button>
</div>
<script>
  const target = new URLSearchParams(location.search).get('retry');
  if (!target) document.getElementById('msg').textContent = 'The app address is not set. Open config.json in the desktop app folder and set "appUrl".';
  document.getElementById('retry').onclick = () => { if (target) location.href = target; };
  window.addEventListener('online', () => { if (target) location.href = target; });
</script></body></html>
