# Hosting the church app on Netlify (a static site: no server is needed).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_APP_TARGET = "web"

# Single-page app: every address opens the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must never be cached for long, or updates would not reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
