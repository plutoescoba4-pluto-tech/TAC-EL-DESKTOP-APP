<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2472">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TAC East Legon - Attendance</title>
<style>
/* From the TAC membership sheet
   Palette: red / blue / white (from the assembly logo) */
:root{
  --red:#E10600; --red-d:#B80500; --red-l:#FDECEB;
  --blue:#0A2472; --blue-d:#061852; --blue-m:#1B3C9E; --blue-l:#EAF0FC;
  --white:#fff; --bg:#F4F6FB; --line:#DDE3F0; --ink:#0F1B3D; --muted:#5B6787;
  --ok:#0E8F4B; --ok-l:#E6F6EC; --warn:#B26A00; --warn-l:#FFF3DC;
  --r:14px; --shadow:0 1px 2px rgba(10,36,114,.06),0 4px 14px rgba(10,36,114,.08);
  --nav-h:62px; --top-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-m);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:12px;padding:.78rem 1.1rem;font-weight:650;cursor:pointer;background:var(--blue);color:#fff;min-height:46px;transition:.15s;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--red)}.btn.red:hover{background:var(--red-d)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--blue-l)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #F4B8B5}
.btn.danger:hover{background:var(--red-l)}
.btn.sm{min-height:36px;padding:.4rem .8rem;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}

/* ---------- auth ---------- */
#auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--blue-d),var(--blue) 55%,var(--blue-m));position:relative;overflow:hidden}
#auth:before{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;background:var(--red);opacity:.9}
#auth:after{content:"";position:absolute;left:-90px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:#fff;opacity:.09}
.auth-card{position:relative;z-index:1;background:#fff;border-radius:22px;padding:28px 24px;width:100%;max-width:410px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.auth-card .logo{width:92px;height:92px;display:block;margin:0 auto 6px}
.auth-card h1{text-align:center;font-size:1.3rem;color:var(--blue)}
.auth-card .sub{text-align:center;color:var(--muted);margin:2px 0 18px;font-size:.92rem}
.auth-foot{position:relative;z-index:1;color:#fff;opacity:.85;margin-top:18px;font-size:.8rem;text-align:center}
.swap{background:none;border:0;color:var(--blue-m);font-weight:600;cursor:pointer;margin-top:12px;width:100%}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field label{font-size:.82rem;font-weight:650;color:var(--blue)}
.field label .req{color:var(--red)}
.input,.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:.7rem .8rem;background:#fff;min-height:46px;outline:none;transition:.12s}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--blue-m);box-shadow:0 0 0 3px rgba(27,60,158,.14)}
.field input[readonly],.field input:disabled,.field select:disabled{background:#F1F4FA;color:var(--muted)}
.field.err input,.field.err select{border-color:var(--red)}
.grid{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:640px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);border-radius:11px;min-height:46px;cursor:pointer;font-weight:600;color:var(--ink);background:#fff}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 2px 10px rgba(6,24,82,.3)}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--red)}
.topbar img{width:38px;height:38px;background:#fff;border-radius:50%;padding:3px;object-fit:contain}
.topbar .t{font-weight:750;letter-spacing:.2px;line-height:1.1;font-size:.98rem}
.topbar .t small{display:block;font-weight:500;opacity:.8;font-size:.72rem}
.topbar .sp{flex:1}
.topbar .who{font-size:.78rem;text-align:right;line-height:1.15;opacity:.95}
.topbar .who b{display:block;font-size:.85rem}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--blue-l);color:var(--blue)}
.badge.red{background:var(--red-l);color:var(--red-d)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:11px;cursor:pointer;font-size:1.1rem}

.layout{flex:1;display:flex;min-height:0}
.side{display:none}
main{flex:1;min-width:0;padding:16px 14px calc(var(--nav-h) + 24px);max-width:1180px;width:100%;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:650;color:var(--muted)}
.bottomnav a .ic{font-size:1.3rem;line-height:1}
.bottomnav a.on{color:var(--red)}
.bottomnav a.plus .ic{background:var(--red);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 16px rgba(225,6,0,.4);font-size:1.6rem}
@media(min-width:900px){
  .bottomnav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:232px;padding:18px 12px;background:#fff;border-right:1px solid var(--line);position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h))}
  .side a{display:flex;align-items:center;gap:12px;padding:.78rem 1rem;border-radius:12px;font-weight:650;color:var(--ink)}
  .side a:hover{background:var(--blue-l)}
  .side a.on{background:var(--blue);color:#fff}
  .side .ic{width:22px;text-align:center}
  .side .foot{margin-top:auto;font-size:.72rem;color:var(--muted);text-align:center;padding:8px}
  main{padding:24px 28px 40px}
}

/* ---------- cards / dashboard ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;border:1px solid #EAEFF8}
.card h2{font-size:1.02rem;color:var(--blue);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-title h1{font-size:1.35rem;color:var(--blue)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:var(--r);padding:14px;border:1px solid #EAEFF8;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
.stat.r{border-top-color:var(--red)}
.stat .n{font-size:1.9rem;font-weight:800;color:var(--blue);line-height:1.05}
.stat.r .n{color:var(--red)}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600}
.hero-search{display:flex;gap:10px;flex-wrap:wrap}
.hero-search .input{flex:1;min-width:200px}

/* ---------- member list / cards ---------- */
.toolbar{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}
.toolbar .wide{grid-column:1/-1}
@media(min-width:900px){.toolbar{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.toolbar .wide{grid-column:auto}}
.mgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.mgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:var(--r);padding:12px;border:1px solid #EAEFF8;box-shadow:var(--shadow)}
.avatar{width:62px;height:78px;border-radius:10px;object-fit:cover;background:var(--blue-l);flex:none;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800;font-size:1.2rem;border:2px solid var(--blue-l)}
.mcard .info{flex:1;min-width:0}
.mcard .nm{font-weight:750;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .id{color:var(--red-d);font-weight:700;font-size:.8rem;letter-spacing:.2px}
.mcard .meta{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .btn{margin-top:6px}
.rowlist .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rowlist .row:last-child{border:0}
.rowlist .avatar{width:42px;height:52px;font-size:.9rem}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .big{font-size:2.4rem}

/* ---------- profile ---------- */
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-head .photo{width:112px;height:144px;border-radius:14px;object-fit:cover;background:var(--blue-l);border:3px solid var(--blue);flex:none;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--blue)}
.profile-head h1{font-size:1.4rem;color:var(--blue)}
.profile-head .mid{font-weight:800;color:var(--red);letter-spacing:.4px;font-size:1.05rem;margin:2px 0 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kv{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:640px){.kv{grid-template-columns:1fr 1fr;gap:0 24px}}
.kv .i{padding:8px 0;border-bottom:1px dashed var(--line)}
.kv .i span{display:block;font-size:.74rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.kv .i b{font-weight:600;word-break:break-word}

/* ---------- registration form ---------- */
details.sec{background:#fff;border:1px solid #EAEFF8;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:750;color:var(--blue);display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--blue-l),#fff)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .k{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem}
details.sec>summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:.15s}
details.sec[open]>summary:after{transform:rotate(-135deg);margin-top:3px}
details.sec .body{padding:16px 16px 4px}
.photo-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-prev{width:132px;height:176px;border-radius:12px;border:2px dashed var(--line);background:var(--blue-l);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;overflow:hidden;flex:none}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-btns{display:flex;flex-direction:column;gap:8px;flex:1;min-width:170px}
.savebar{position:sticky;bottom:calc(var(--nav-h) + 6px);display:flex;gap:10px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:10px;border:1px solid var(--line);border-radius:16px;box-shadow:0 -6px 24px rgba(10,36,114,.12);z-index:20}
.savebar .btn{flex:1}
@media(min-width:900px){.savebar{bottom:12px}}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,24,82,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
@media(min-width:640px){.modal{border-radius:22px}}
.modal h2{color:var(--blue);margin-bottom:12px;font-size:1.15rem}
.modal .mfoot{display:flex;gap:10px;margin-top:6px}
.modal .mfoot .btn{flex:1}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:62vh;margin:0 auto 12px}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .guide{position:absolute;inset:8% 14%;border:3px dashed rgba(255,255,255,.85);border-radius:50% 50% 46% 46%/42% 42% 58% 58%;pointer-events:none}
#toasts{position:fixed;left:0;right:0;top:calc(var(--top-h) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--blue-d);color:#fff;padding:.7rem 1.1rem;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;max-width:92vw;animation:pop .2s}
.toast.err{background:var(--red)}
.toast.ok{background:var(--ok)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- settings ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{border:0;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:.5rem 1rem;font-weight:650;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.segrow{display:grid;grid-template-columns:28px 1.5fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.segrow .n{width:26px;height:26px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
.segrow select,.segrow input{border:1.5px solid var(--line);border-radius:10px;padding:.5rem;min-height:42px;width:100%;background:#fff}
.segrow .ctl{display:flex;gap:4px}
.segrow .ctl button{border:1.5px solid var(--line);background:#fff;border-radius:9px;width:34px;height:42px;cursor:pointer}
.preview-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25rem;font-weight:800;color:var(--red);background:var(--red-l);border-radius:12px;padding:12px 14px;margin:6px 0;word-break:break-all}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;padding:8px;border-bottom:2px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tscroll{overflow-x:auto}
.old{color:var(--muted);text-decoration:line-through}
.new{color:var(--ok);font-weight:700}

/* ---------- ID card (CR80 85.6 x 54 mm) ---------- */
.cardwrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.cface-wrap{width:min(100%,430px);container-type:inline-size}
.cface{position:relative;width:100%;aspect-ratio:85.6/54;border-radius:3.2cqw;overflow:hidden;background:#fff;box-shadow:0 8px 28px rgba(10,36,114,.25);border:1px solid #cfd6ea;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cface .top{position:absolute;left:0;right:0;top:0;height:21cqw;background:linear-gradient(100deg,var(--blue-d),var(--blue) 70%);}
.cface .top:after{content:"";position:absolute;left:0;right:0;bottom:-1.2cqw;height:1.2cqw;background:var(--red)}
.cface .brand{position:absolute;left:3.5cqw;top:2.6cqw;display:flex;align-items:center;gap:2.6cqw;color:#fff}
.cface .brand img{width:13.5cqw;height:13.5cqw;background:#fff;border-radius:50%;padding:.8cqw;object-fit:contain}
.cface .brand .b1{font-weight:800;font-size:5cqw;letter-spacing:.2cqw;line-height:1}
.cface .brand .b2{font-weight:600;font-size:3cqw;opacity:.92;margin-top:1cqw;letter-spacing:.5cqw}
.cface .brand .b3{font-size:2.3cqw;opacity:.8;margin-top:1.2cqw;font-style:italic}
.cface .ph{position:absolute;left:4cqw;top:25cqw;width:23.5cqw;height:31.5cqw;border-radius:2cqw;border:.9cqw solid #fff;box-shadow:0 1cqw 3cqw rgba(0,0,0,.3);object-fit:cover;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:8cqw;color:var(--blue)}
.cface .det{position:absolute;left:31.5cqw;right:3cqw;top:24.5cqw}
.cface .det .nm{font-weight:800;color:var(--blue);font-size:4.3cqw;line-height:1.12;text-transform:uppercase}
.cface .det .mid{color:var(--red);font-weight:800;font-size:3.9cqw;letter-spacing:.15cqw;margin:1cqw 0 1.4cqw;font-family:ui-monospace,Menlo,Consolas,monospace}
.cface .det .ln{font-size:2.8cqw;color:#26335f;line-height:1.45}
.cface .det .ln b{color:var(--blue)}
.cface .exp{position:absolute;right:0;bottom:0;background:var(--red);color:#fff;font-weight:700;font-size:2.8cqw;padding:1.2cqw 3.2cqw;border-top-left-radius:2.4cqw}
.cface .exp span{font-weight:500;opacity:.9}
.cback .stripe{position:absolute;left:0;right:0;top:0;height:6cqw;background:var(--blue)}
.cback .stripe:after{content:"";position:absolute;left:0;right:0;bottom:-.9cqw;height:.9cqw;background:var(--red)}
.cback .qr{position:absolute;left:4cqw;top:11cqw;width:29cqw;height:29cqw;background:#fff;padding:1.4cqw;border:.5cqw solid var(--line);border-radius:2cqw}
.cback .qr img,.cback .qr canvas{width:100%!important;height:100%!important;display:block}
.cback .qid{position:absolute;left:3cqw;top:41.5cqw;width:31cqw;text-align:center;font-weight:800;color:var(--blue);font-size:2.35cqw;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.cback .info{position:absolute;left:38cqw;right:3.5cqw;top:10cqw;font-size:3cqw;color:#26335f;line-height:1.5}
.cback .info h4{margin:0 0 .8cqw;color:var(--blue);font-size:3.4cqw}
.cback .info .rt{margin-top:2cqw;font-size:2.6cqw;color:var(--muted)}
.cback .pw{position:absolute;left:0;right:0;bottom:0;background:var(--blue);color:#fff;text-align:center;padding:1.7cqw 0;font-size:2.55cqw;letter-spacing:.35cqw;font-weight:700}
.cback .pw b{color:#fff}.cback .pw i{font-style:normal;color:#ff8a85}
.cback .pw small{display:block;font-size:2.1cqw;letter-spacing:.7cqw;opacity:.9;font-weight:600;margin-top:.4cqw}

@media print{
  @page{size:85.6mm 54mm;margin:0}
  body{background:#fff}
  .topbar,.side,.bottomnav,#toasts,.noprint{display:none!important}
  main{padding:0!important;max-width:none}
  .cardwrap{display:block}
  .cface-wrap{width:85.6mm!important;height:54mm;page-break-after:always;break-after:page}
  .cface{box-shadow:none;border:0;border-radius:0}
}

/* ---------- additions ---------- */
svg.i{flex:none;vertical-align:middle}
.btn span{line-height:1}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:70px}
.pw-toggle{position:absolute;right:6px;top:6px;height:34px;border:0;background:var(--blue-l);color:var(--blue);font-weight:700;border-radius:8px;padding:0 12px;cursor:pointer}
.auth-help{text-align:center;color:var(--muted);font-size:.82rem;margin:14px 0 0}
.bottomnav a .ic{display:flex;align-items:center;justify-content:center;height:24px}
.bottomnav a.plus .ic{height:46px}
.side .ic{display:flex;align-items:center;justify-content:center}
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;background:#fff;border:1px solid #EAEFF8;border-left:4px solid var(--red);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.9rem;color:var(--muted)}
.strip b{color:var(--blue);font-size:1rem}
.cols{display:grid;gap:0 16px}
@media(min-width:900px){.cols.c2{grid-template-columns:1fr 1fr}}
.hbar{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;margin-bottom:9px;font-size:.86rem}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hbar .tr{background:var(--blue-l);border-radius:99px;height:12px;overflow:hidden}
.hbar .fl{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-m));border-radius:99px}
.hbar b{text-align:right;color:var(--blue)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:6px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.78rem;color:var(--muted)}
.vbars .c b{color:var(--blue);font-size:.85rem}
.vbars .c .b{width:100%;max-width:46px;background:linear-gradient(180deg,var(--red),var(--red-d));border-radius:8px 8px 0 0;min-height:3px}
.donut-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.legend>div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.92rem}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dayb{width:38px;height:38px;border-radius:10px;background:var(--red-l);color:var(--red-d);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.empty .big{display:none}
.topbar .t{white-space:nowrap}
@media(max-width:520px){.topbar .who{display:none}.topbar .t small{display:none}}


/* ---------- charts v2 ---------- */
.card.chart h2 .chip{margin-left:auto;font-size:.72rem;background:var(--blue-l);color:var(--blue);border-radius:99px;padding:3px 10px;font-weight:700}
.donut-row{gap:18px 26px}
.donut2{position:relative;width:158px;height:158px;flex:none;filter:drop-shadow(0 8px 14px rgba(10,36,114,.18))}
.donut2 svg{width:100%;height:100%;display:block}
.donut2 .arc{animation:arcin 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes arcin{from{stroke-dasharray:0 400}}
.donut2 .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut2 .mid b{font-size:1.9rem;line-height:1;color:var(--blue);font-weight:800}
.donut2 .mid span{font-size:.72rem;color:var(--muted);font-weight:650;margin-top:2px}
.legend2{flex:1;min-width:150px;display:grid;gap:10px}
.legend2 .lg{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px}
.legend2 .lg i{width:14px;height:14px;border-radius:50%;flex:none}
.legend2 .lgt{flex:1;font-size:.92rem;color:var(--ink)}.legend2 .lgt b{font-size:1.15rem}
.legend2 .pct{font-weight:800;font-size:1rem}
.vbars2{display:flex;align-items:flex-end;gap:10px;height:200px;padding:6px 2px 0;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#EEF2FA calc(25% - 1px),#EEF2FA 25%)}
.vbars2 .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:.76rem;color:var(--muted)}
.vbars2 .c b{color:var(--blue);font-size:.88rem}
.vbars2 .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.vbars2 .b{width:100%;max-width:44px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,#5C7BE0,var(--blue));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 4px 10px rgba(10,36,114,.2)}
.vbars2 .c.now .b{background:linear-gradient(180deg,#FF6A63,var(--red-d));box-shadow:0 6px 14px rgba(225,6,0,.3)}
.vbars2 .c.now b{color:var(--red)}
@keyframes grow{from{transform:scaleY(0)}}
.hbar2{margin-bottom:12px}
.hbar2 .top{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-bottom:4px}
.hbar2 .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.hbar2 .val b{color:var(--blue)}.hbar2 .val small{color:var(--muted)}
.hbar2 .tr{background:var(--blue-l);border-radius:99px;height:12px;overflow:hidden}
.hbar2 .fl{height:100%;border-radius:99px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(90deg,#5C7BE0,var(--blue))}
.hbar2 .fl.r0{background:linear-gradient(90deg,#FF6A63,var(--red-d))}
.hbar2 .fl.r1{background:linear-gradient(90deg,#3D63D6,var(--blue-d))}
@keyframes growx{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.donut2 .arc,.vbars2 .b,.hbar2 .fl{animation:none}}

/* ---------- profile RFID box ---------- */
.rfidbox{border-left:4px solid var(--red)}
.rfid-now{margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;color:var(--blue);letter-spacing:.5px}
.rfid-form{display:flex;gap:10px;margin-bottom:8px}
.rfid-form .input{flex:1;min-width:0}

/* ---------- scanner ---------- */
.scanbox{position:relative}
.scanline{position:absolute;left:8%;right:8%;height:3px;background:var(--red);box-shadow:0 0 14px var(--red);animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{top:12%}to{top:86%}}

/* ---------- phones ---------- */
html,body{overflow-x:hidden}
@media(max-width:620px){
  main{padding:12px 10px calc(var(--nav-h) + 22px)}
  .card{padding:14px 12px}
  .page-title h1{font-size:1.2rem}
  .bottomnav a{font-size:.64rem;min-width:0}
  .profile-head{gap:12px}
  .profile-head .photo{width:92px;height:118px;font-size:1.6rem}
  .profile-head h1{font-size:1.2rem}
  .profile-head>div{min-width:0!important;flex:1 1 150px}
  .profile-head .actions{display:grid;grid-template-columns:1fr 1fr}
  .profile-head .actions .btn{width:100%;padding:.4rem .5rem}
  .rfid-form{flex-direction:column}.rfid-form .btn{width:100%}
  .donut2{width:140px;height:140px;margin:0 auto}
  .legend2{min-width:100%}
  .vbars2{height:170px;gap:6px}
  .stat .n{font-size:1.6rem}
  .savebar{padding:8px;gap:8px;border-radius:14px}.savebar .btn{padding:.6rem .4rem;font-size:.9rem}
  .modal{padding:16px;max-height:90dvh}
  .toast{max-width:94vw;font-size:.92rem}
  .segrow{grid-template-columns:24px 1fr auto}.segrow>:nth-child(3){grid-column:2/3}
  .hero-search .btn{flex:1}
}
@media(max-width:380px){.bottomnav a span:last-child{font-size:.6rem}.toolbar{grid-template-columns:1fr}}

/* ---------- attendance additions ---------- */
.sm{font-size:.85rem}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row .avatar{width:42px;height:52px;font-size:.9rem}
.row.fresh{animation:fl 2.5s}@keyframes fl{from{background:#FFF3DC}to{background:transparent}}
a.row{color:inherit}

.nb{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px;font-weight:700}.bottomnav .nb{margin-left:4px}
.bottomnav{overflow-x:auto}.bottomnav a{flex:1 0 auto;min-width:74px}
.pubwrap{max-width:520px;margin:0 auto;padding:0 14px 30px}.pubtop{background:linear-gradient(135deg,#061852,#0A2472);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 56px;text-align:center}.pubtop img{width:56px;height:56px;border-radius:50%;background:#fff;padding:3px}.pubtop b{display:block;margin-top:6px}
.pubcard{margin-top:-40px}.pph{width:92px;height:116px;border-radius:12px;object-fit:cover;background:var(--blue-l);display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:1.6rem;flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
#regbar{background:var(--red);color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.9rem}#regbar button{background:#fff;color:var(--red);border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}

function embClient(url,key){
  var EMB=window.parent!==window;
  if(!EMB)return supabase.createClient(url,key,{db:{schema:'att'},auth:{autoRefreshToken:true}});
  /* Inside the admin: never touch the real session. Borrow the admin's token read-only; the admin refreshes it. */
  var ref=(url.match(/\/\/([^.]+)\./)||[])[1],K='sb-'+ref+'-auth-token',mem={},last='';
  var store={getItem:function(k){return k in mem?mem[k]:null},setItem:function(k,v){mem[k]=v},removeItem:function(k){delete mem[k]}};
  var c=supabase.createClient(url,key,{db:{schema:'att'},auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:false,storage:store,storageKey:'emb-auth'}});
  function pull(){try{var raw=localStorage.getItem(K);if(!raw)return;var s=JSON.parse(raw);if(!s||!s.access_token)return;
    s.expires_at=Math.floor(Date.now()/1000)+3300;s.expires_in=3300;mem['emb-auth']=JSON.stringify(s);
    if(s.access_token!==last){last=s.access_token;try{c.realtime.setAuth(s.access_token)}catch(e){}}}catch(e){}}
  pull();setInterval(pull,15000);addEventListener('storage',pull);
  return c;
}
async function boot(){
  if(!window.supabase){document.body.innerHTML='<p style="padding:20px">Could not load online components. Check the internet connection and refresh.</p>';return}
  sb=embClient(CFG.URL,CFG.KEY);const EMB=window.parent!==window;if(EMB){const o=document.getElementById('out');if(o)o.style.display='none'}
  const pm=location.hash.match(/^#\/m\/([a-f0-9]{32})/i);if(pm){vPublic(pm[1].toLowerCase());return}
  q('#ns1').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" data-h="${n[0]}"><span class="ic">${ico(n[0],20)}</span>${n[2]}${n[0]==='alerts'?'<span class="nb hidden" data-nb></span>':''}</a>`).join('')+'<div class="foot">Powered by PLUTO-TECH<br>LEARN. BUILD. INSPIRE.</div>';
  q('#ns2').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" data-h="${n[0]}"><span class="ic">${ico(n[0],22)}</span>${n[1]}${n[0]==='alerts'?'<span class="nb hidden" data-nb></span>':''}</a>`).join('');
  q('#pwt').onclick=()=>{const p=q('#p'),s=p.type==='password';p.type=s?'text':'password';q('#pwt').textContent=s?'Hide':'Show'};
  q('#lf').onsubmit=async e=>{e.preventDefault();const u=q('#u').value.trim(),email=u.includes('@')?u:u.toLowerCase().replace(/\s+/g,'')+'@tacel.local';

function newModal(done){

  <div class="card"><h2>Recent attendance</h2>${(h||[]).map(r=>`<div class="row" style="cursor:default"><div style="flex:1"><b>${r.sessions?fd(r.sessions.session_date):''}</b><div class="muted sm">${esc(r.sessions?.name||'')}</div></div><div style="text-align:right"><b>${hm(r.clock_in)}</b>${r.is_late?'<div><span class="badge warn">Late</span></div>':''}</div></div>`).join('')||'<p class="muted">No attendance yet.</p>'}</div>`;
  const R=async(fn,args,msg,nt)=>{const{error}=await sb.rpc(fn,args);if(error)return fail(error);toast(msg);vCardMgr(id,nt)};
  q('#cm')&&(q('#cm').onclick=()=>R('attendance_mark',{p_member:id,p_session:q('#cs').value},'Marked present'));
  q('#cxs')&&(q('#cxs').onclick=async()=>{const{error}=await sb.from('members').update({card_expiry:q('#cx').value||null}).eq('id',id);error?fail(error):(toast('Expiry saved'),vCardMgr(id))});
  q('#cl')&&(q('#cl').onclick=()=>{if(confirm('Switch this card off? The RFID card and the QR code will stop working.'))R('member_card_lost',{p_member:id},'Card switched off','<b>Card switched off.</b> You can now issue a temporary card.')});
  q('#ct')&&(q('#ct').onclick=()=>R('member_card_temp',{p_member:id},'Temporary card created','<b>Temporary card created.</b> Print it with the button below, then assign its RFID card on the Cards page.'));
  q('#cf')&&(q('#cf').onclick=()=>{if(confirm('Switch the main card back on and the temporary card off?'))R('member_card_found',{p_member:id},'Main card is active again','<b>Main card is active again.</b> The temporary card is switched off.')});
}
/* ---------- Installable app + push notifications ---------- */
let installEv=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});

const u8=b=>{const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function bellModal(){
  const ok='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window,ios=/iphone|ipad|ipod/i.test(navigator.userAgent),app=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let sub=null;if(ok){try{sub=await (await navigator.serviceWorker.ready).pushManager.getSubscription()}catch(e){}}
  modal(`<h2>Notifications</h2>${!ok?`<p class="muted">${ios&&!app?'On iPhone, tap Share, then Add to Home Screen, and open the app from its icon. Then come back here to turn notifications on.':'This browser does not support notifications.'}</p>`:`<p class="muted">${sub?'Notifications are on for this device.':'Turn on notifications to get live alerts on this device. The administrator chooses which alerts you receive.'}</p><button class="btn ${sub?'ghost':'red'}" id="bn">${sub?'Turn off':'Turn on notifications'}</button>`}${installEv?'<p><button class="btn ghost" id="bi">Install the app</button></p>':''}<div style="margin-top:12px"><button class="btn ghost" id="bx">Close</button></div>`,m=>{
    q('#bx',m).onclick=closeM;
    q('#bi',m)&&(q('#bi',m).onclick=()=>{installEv.prompt();installEv=null;closeM()});
    q('#bn',m)&&(q('#bn',m).onclick=async()=>{try{
      if(sub){await sb.rpc('push_unsubscribe',{p_endpoint:sub.endpoint});await sub.unsubscribe();toast('Notifications turned off');closeM();return}
      if(await Notification.requestPermission()!=='granted')return toast('Notifications were not allowed.',1);
      const{data:cfg}=await sb.rpc('push_config');if(!cfg||!cfg.vapid_public)return toast('Push is not set up yet. Ask the administrator.',1);
      const s=await (await navigator.serviceWorker.ready).pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(cfg.vapid_public)}),j=s.toJSON();
      const{error}=await sb.rpc('push_subscribe',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});if(error)throw error;toast('Notifications are on');closeM();
    }catch(e){fail(e)}});
  });
}
async function pushCard(){
  const box=document.createElement('div');q('#view').appendChild(box);
  const[{data:cfg},{data:staff},{data:pf}]=await Promise.all([sb.rpc('push_config'),sb.from('profiles').select('id,full_name,email,role').eq('active',true).order('full_name'),sb.from('push_prefs').select('*')]);
  const P={};(pf||[]).forEach(r=>P[r.user_id]=r);const ev=[['on_arrival','Arrivals'],['on_visitor','Visitors'],['on_unknown','Unknown cards'],['on_close','Service closed']];
  box.innerHTML=`<div class="card"><h2>Push notifications</h2>${cfg&&cfg.vapid_public?'':'<p class="muted">One-time setup: create the notification keys. They are made in this browser and the private key is never stored on the site.</p><button class="btn" id="pk">Create keys</button><div id="pko" style="margin-top:10px"></div>'}
  <p class="muted sm">Choose who receives each alert. Each person turns notifications on with the bell at the top of their own device. Arrivals are sent as a summary every 5 minutes.</p>
  <div style="overflow-x:auto"><table style="width:100%;font-size:.9rem"><tr><th align="left">Person</th>${ev.map(e=>`<th>${e[1]}</th>`).join('')}</tr>${(staff||[]).map(s=>`<tr><td style="padding:6px 0">${esc(s.full_name||s.email||'')}</td>${ev.map(e=>`<td align="center"><input type="checkbox" data-u="${s.id}" data-k="${e[0]}" style="width:auto;min-height:0" ${P[s.id]&&P[s.id][e[0]]?'checked':''}></td>`).join('')}</tr>`).join('')}</table></div>
  <div style="margin-top:12px"><button class="btn ghost" id="pt">Send me a test notification</button></div></div>`;
  qa('[data-u]',box).forEach(c=>c.onchange=async()=>{const row=P[c.dataset.u]||{user_id:c.dataset.u,on_arrival:false,on_visitor:false,on_unknown:false,on_close:false};row[c.dataset.k]=c.checked;P[c.dataset.u]=row;const{error}=await sb.from('push_prefs').upsert(row);error?fail(error):toast('Saved')});
  q('#pt',box).onclick=async()=>{const{error}=await sb.rpc('push_test');error?fail(error):toast('Test sent. It arrives on devices where notifications are on.')};
  q('#pk',box)&&(q('#pk',box).onclick=async()=>{
    const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']),jwk=await crypto.subtle.exportKey('jwk',kp.privateKey),pub=new Uint8Array(65);
    pub[0]=4;pub.set(u8(jwk.x),1);pub.set(u8(jwk.y),33);const ps=b64u(pub);
    const{error}=await sb.rpc('push_set_public',{p_key:ps});if(error)return fail(error);
    q('#pko',box).innerHTML=`<div class="card" style="border-left:4px solid var(--red)"><b>Copy these two values now. The private key is shown only once.</b><p class="sm" style="margin:10px 0 4px">VAPID_PUBLIC_KEY</p><input class="input mono" readonly value="${ps}"><p class="sm" style="margin:10px 0 4px">VAPID_PRIVATE_KEY</p><input class="input mono" readonly value="${jwk.d}"><p class="muted sm">Add both as secrets of the push-notify function in Supabase.</p></div>`;
  });
}
boot();
})();
</script>
