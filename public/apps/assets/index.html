<template id="tpl-shared">
<!-- Scan modal -->
<div class="modal fade" id="scanModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header tac">
        <h2 class="modal-title h5 mb-0">Scan an item QR</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="scanReader"></div>
        <div class="alert alert-warning py-2 small mt-3 mb-0" id="scanError" style="display:none;"></div>
        <p class="small text-body-secondary mt-3 mb-2">Point your camera at an asset's QR code. Camera not working? Upload a photo of the code instead.</p>
        <label class="btn btn-outline-secondary btn-sm mb-0">Upload QR image
          <input type="file" id="scanFile" accept="image/*" hidden>
        </label>
        <div id="scanFileHelper" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header tac">
        <h2 class="modal-title h5 mb-0" id="panelTitle">Add item</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="itemForm">
          <div class="mb-3">
            <label class="form-label" for="f_idformat">Asset tag ID</label>
            <select id="f_idformat" class="form-select mb-2" aria-label="ID template"></select>
            <div class="input-group no-prefix" id="idBuilder">
              <span class="input-group-text id-prefix" id="idPrefix"></span>
              <input id="f_tag" class="form-control" autocomplete="off" aria-label="ID number">
            </div>
            <div class="form-text" id="tagHint"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="f_name">Asset name / title</label>
            <input id="f_name" class="form-control" placeholder="Digital Audio Console" required="">
          </div>
          <div class="mb-3">
            <label class="form-label" for="btnCam">Photo <span class="text-body-secondary fw-normal">(optional)</span></label>
            
            <img class="photo-preview" id="photoPreview" alt="" style="display:none">
            <input type="file" id="photoFile" accept="image/*" hidden>
            <div class="d-flex gap-2 flex-wrap">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCam">Take photo</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="btnPhoto">From gallery</button>
              
            </div>
            
            <div class="form-text" id="photoHint"></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-8">
              <label class="form-label" for="f_category">Category</label>
              <input id="f_category" class="form-control" list="categoryList" placeholder="Audio / Visual">
              <datalist id="categoryList"></datalist>
            </div>
            <div class="col-4">
              <label class="form-label" for="f_quantity">Quantity</label>
              <input id="f_quantity" type="number" min="1" step="1" value="1" inputmode="numeric" class="form-control">
            </div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label" for="f_section">Section</label>
              <select id="f_section" class="form-select"></select>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="f_subsection">Sub-section</label>
              <select id="f_subsection" class="form-select"></select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="f_site">Exact spot</label>
            <input id="f_site" class="form-control" placeholder="Sound booth, top shelf">
          </div>

    var tag = decodeURIComponent(m[1]), a = A.find(function (x) { return x.asset_tag === tag; });

    if (!a) { root.innerHTML = '<div class="rec-shell"><div class="info-card"><h2>Not found</h2><p class="mb-3">No item with the ID ' + esc(tag) + ' is on the register.</p><a class="btn btn-tac-primary" href="#">Back to the register</a></div></div>'; return; }
    var un = m[2] ? (UN[tag] || []).find(function (u) { return u.unit_no === Number(m[2]); }) : null;
    var w = warranty(a.warranty), st = un ? un.status : a.status;
    function row(k, v) { return v ? '<div class="info-row"><span class="k">' + k + '</span><span class="v">' + esc(v) + '</span></div>' : ''; }
    root.innerHTML = '<div class="rec-top"><div class="container"><div class="brand"><img src="' + esc($('.logo-crest').src) + '" alt=""><span>TAC East Legon Assembly · Asset Register</span></div><a class="btn btn-sm btn-light" href="#">Back</a></div></div>' +
      '<div class="rec-shell">' + (a.photo_path && photoUrls[a.photo_path] ? '<div class="rec-photo"><img src="' + esc(photoUrls[a.photo_path]) + '" alt=""></div>' : '') +
      '<div class="rec-hero"><span class="chip">' + esc(tag) + '</span>' + (un ? '<span class="chip chip-unit">Unit ' + un.unit_no + ' of ' + (a.quantity || 1) + '</span>' : '') +
      '<h1 class="display-font">' + esc(a.name) + '</h1><div class="brand-line">' + esc(a.brand || '') + '</div>' +
      '<div class="flags"><span class="badge badge-status text-bg-' + statusClass(st) + '">' + esc(st || '') + '</span><span class="flag-warranty ' + w.c + '">Warranty: ' + esc(w.t) + '</span></div></div>' +
      '<div class="rec-actions"><button class="btn btn-tac-primary" id="recEdit">Edit item</button><button class="btn btn-outline-secondary" id="recQr">View QR code</button></div>' +
      '<div class="info-grid"><div class="info-card"><h2>Where it is</h2>' + row('Section', a.section) + row('Sub-section', a.subsection) + row('Exact spot', un && un.site ? un.site : a.site) + row('Custodian', a.custodian) + '</div>' +
      '<div class="info-card"><h2>Details</h2>' + row('Category', a.category) + row('Quantity', String(a.quantity || 1)) + row('Serial', a.serial) + row('Purchased', a.purchase_date ? fmtDate(a.purchase_date) : '') + row('Last audit', a.last_audit ? fmtDate(a.last_audit) : '') + '</div>' +
      '<div class="info-card wide"><h2>Value</h2><div class="money-pair"><div class="m"><div class="k">Cost price</div><div class="n">' + (a.cost != null ? money(a.cost) : '—') + '</div></div><div class="m"><div class="k">Replacement value</div><div class="n red">' + (a.replacement != null ? money(a.replacement) : '—') + '</div></div></div></div></div>' +
      '<p class="rec-foot">Powered by Pluto-Tech — learn, build, inspire.</p></div>';
    $('#recEdit').onclick = function () { location.hash = ''; setTimeout(function () { openItem(tag); }, 50); };
    $('#recQr').onclick = function () { location.hash = ''; setTimeout(function () { if ((a.quantity || 1) > 1) showUnits(tag); else showQr(tag); }, 50); };
  }

  /* ---------- sections ---------- */
  function renderSections() {
    $('#sectionList').innerHTML = S.map(function (s, i) {
      return '<div class="sec-card" data-i="' + i + '"><div class="d-flex justify-content-between align-items-start gap-2"><div><strong>' + esc(s.name) + '</strong>' + (s.description ? '<div class="small text-body-secondary">' + esc(s.description) + '</div>' : '') + '</div>' +
        '<button class="btn btn-sm btn-outline-danger sec-del" type="button">Delete</button></div>' +
        '<div class="sec-chips">' + ((s.subsections || []).map(function (x, j) { return '<span class="sec-chip">' + esc(x) + '<button type="button" class="sub-del" data-j="' + j + '" aria-label="Remove ' + esc(x) + '">×</button></span>'; }).join('') || '<span class="small text-body-secondary">No sub-sections yet.</span>') + '</div>' +
        '<div class="input-group input-group-sm"><input class="form-control sub-name" placeholder="New sub-section"><button class="btn btn-outline-secondary sub-add" type="button">Add</button></div></div>';
    }).join('') || '<p class="small text-body-secondary">No sections yet.</p>';
  }
  async function secOp(fn) { try { await fn(); await load(); renderSections(); render(); } catch (e) { $('#secError').textContent = e.message || 'Could not save.'; $('#secError').style.display = ''; } }

  /* ---------- ID templates ---------- */
  function renderFormats() {
    $('#idFormatList').innerHTML = F.map(function (f) {
      var p = parsePattern(f.pattern), n = p ? A.filter(function (a) { return a.asset_tag.indexOf(p.prefix) === 0; }).length : 0;
      return '<div class="sec-card d-flex justify-content-between align-items-center gap-2"><div><strong>' + esc(f.name) + '</strong><div class="small text-body-secondary">' + esc(f.pattern) + ' · ' + n + ' item' + (n === 1 ? '' : 's') + '</div></div><button class="btn btn-sm btn-outline-danger idf-del" type="button" data-id="' + f.id + '">Delete</button></div>';
    }).join('') || '<p class="small text-body-secondary">No ID templates yet.</p>';
  }

  /* ---------- export ---------- */
  function exportCsv() {
    var cols = ['Tag', 'Item', 'Qty', 'Category', 'Sub-category', 'Section', 'Sub-section', 'Exact spot', 'Status', 'Brand', 'Serial', 'Custodian', 'Purchase date', 'Last audit', 'Cost', 'Replacement', 'Warranty'];
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [cols.join(',')].concat(A.map(function (a) { return [a.asset_tag, a.name, a.quantity, a.category, a.subcategory, a.section, a.subsection, a.site, a.status, a.brand, a.serial, a.custodian, a.purchase_date, a.last_audit, a.cost, a.replacement, a.warranty].map(q).join(','); }));
    var b = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'asset-register-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  }

  /* ---------- wiring ---------- */
  function wire() {
    $('#search').addEventListener('input', renderRows);
    $('#filterStatus').addEventListener('change', renderRows);
    $('#filterSection').addEventListener('change', renderRows);
    $('#categoryTabs').addEventListener('click', function (e) { var l = e.target.closest('a[data-cat]'); if (!l) return; e.preventDefault(); catFilter = l.getAttribute('data-cat'); renderFilters(); renderRows(); });
    $('#tbody').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tag]'); if (!b) return; var tag = b.getAttribute('data-tag');
      if (b.classList.contains('qr')) showQr(tag); else if (b.classList.contains('units')) showUnits(tag);
      else if (b.classList.contains('edit')) openItem(tag); else if (b.classList.contains('del')) deleteItem(tag);
    });
    $('#btnAdd').removeAttribute('data-bs-toggle'); $('#btnAdd').removeAttribute('data-bs-target');
    $('#btnAdd').addEventListener('click', function () { openItem(null); });
    $('#btnSave').addEventListener('click', saveItem);
    $('#itemForm').addEventListener('submit', function (e) { e.preventDefault(); saveItem(); });
    $('#f_idformat').addEventListener('change', function () {
      var f = F.find(function (x) { return String(x.id) === this.value; }, this), t = $('#f_tag');
      if (!f) { t.value = ''; t.disabled = true; $('#idPrefix').textContent = ''; return; }
      var p = parsePattern(f.pattern); $('#idPrefix').textContent = p.prefix; t.disabled = false; t.value = nextNumber(f);
      $('#tagHint').textContent = 'Next free ID: ' + p.prefix + t.value + '. You can change the number.';
    });
    $('#f_tag').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });
    $('#f_section').addEventListener('change', function () { fillSub(''); });
    $('#btnBrandNone').addEventListener('click', function () { $('#f_brand').value = 'None'; });
    $('#btnPhoto').addEventListener('click', function () { $('#photoFile').click(); });
    $('#photoFile').addEventListener('change', async function () { var f = this.files[0]; this.value = ''; if (!f) return; try { takePhotoBlob(await toJpeg(f)); } catch (e) { fail(e); } });
    $('#btnCam').addEventListener('click', startCam);
    $('#itemModal').addEventListener('hidden.bs.modal', stopCam);
    $('#btnScan').addEventListener('click', startScan);
    $('#scanModal').addEventListener('hidden.bs.modal', stopScan);
    $('#scanFile').addEventListener('change', function () { var f = this.files[0]; this.value = ''; if (f) scanFile(f); });
    $('#unitsGrid').addEventListener('click', function (e) { var b = e.target.closest('.unit-tile'); if (b) openUnit(Number(b.getAttribute('data-n'))); });
    $('#unitBack').addEventListener('click', function () { modal('#unitModal').hide(); showUnits(curUnits.asset_tag); });
    $('#unitSave').addEventListener('click', async function () {
      try {
        var r = await sb.from('asset_units').update({ status: $('#unit_status').value, site: $('#unit_site').value.trim() || null }).eq('asset_tag', curUnit.asset_tag).eq('unit_no', curUnit.unit_no);
        if (r.error) throw r.error; toast('Unit saved'); await reload(); modal('#unitModal').hide(); showUnits(curUnits.asset_tag);
      } catch (e) { fail(e); }
    });
    $('#btnExport').addEventListener('click', exportCsv);
    $('#btnHelp').addEventListener('click', function () { modal('#helpModal').show(); });
    $('#helpSiteBody').innerHTML = '<p>The Apostolic Church – Ghana, East Legon Assembly.</p><p class="small text-body-secondary">This register is part of the assembly’s admin. Only church administrators can open it.</p>';
    $('#btnSections').addEventListener('click', function () { $('#secError').style.display = 'none'; renderSections(); modal('#sectionModal').show(); });
    $('#secAdd').addEventListener('click', function () {
      var n = $('#sec_name').value.trim(); if (!n) return;
      secOp(async function () {
        if (S.some(function (s) { return s.name.toLowerCase() === n.toLowerCase(); })) throw new Error('That section already exists.');
        var r = await sb.from('sections').insert({ name: n, description: $('#sec_desc').value.trim() || null }); if (r.error) throw r.error;
        $('#sec_name').value = ''; $('#sec_desc').value = ''; $('#secError').style.display = 'none';
      });
    });
    $('#sectionList').addEventListener('click', function (e) {
      var card = e.target.closest('.sec-card'); if (!card) return; var s = S[Number(card.getAttribute('data-i'))];
      if (e.target.closest('.sec-del')) { if (confirm('Delete the section ' + s.name + '? Items keep the section they were saved with.')) secOp(async function () { var r = await sb.from('sections').delete().eq('id', s.id); if (r.error) throw r.error; }); }
      else if (e.target.closest('.sub-del')) { var j = Number(e.target.closest('.sub-del').getAttribute('data-j')); secOp(async function () { var r = await sb.from('sections').update({ subsections: s.subsections.filter(function (_, k) { return k !== j; }) }).eq('id', s.id); if (r.error) throw r.error; }); }
      else if (e.target.closest('.sub-add')) { var v = card.querySelector('.sub-name').value.trim(); if (!v) return; secOp(async function () { if ((s.subsections || []).indexOf(v) >= 0) throw new Error('That sub-section already exists.'); var r = await sb.from('sections').update({ subsections: (s.subsections || []).concat([v]) }).eq('id', s.id); if (r.error) throw r.error; }); }
    });
    $('#btnIdFormats').addEventListener('click', function () { $('#idfError').style.display = 'none'; renderFormats(); modal('#idFormatModal').show(); });
    $('#idfSave').addEventListener('click', async function () {
      var n = $('#idf_name').value.trim(), p = $('#idf_pattern').value.trim().toUpperCase(), er = $('#idfError');
      er.style.display = 'none';
      if (!n || !p) { er.textContent = 'Type the department and the ID template.'; er.style.display = ''; return; }
      if (!parsePattern(p)) { er.textContent = 'The template must end with 1 to 10 # signs, like TAC-EL-MA-#####.'; er.style.display = ''; return; }
      var r = await sb.from('id_formats').insert({ name: n, pattern: p });
      if (r.error) { er.textContent = r.error.code === '23505' ? 'That template already exists.' : r.error.message; er.style.display = ''; return; }
      $('#idf_name').value = ''; $('#idf_pattern').value = ''; await load(); renderFormats();
    });
    $('#idFormatList').addEventListener('click', async function (e) {
      var b = e.target.closest('.idf-del'); if (!b) return; if (!confirm('Delete this ID template? Items already using it keep their IDs.')) return;
      var r = await sb.from('id_formats').delete().eq('id', b.getAttribute('data-id')); if (r.error) return fail(r.error); await load(); renderFormats();
    });
    $('#btnLogout').addEventListener('click', async function () { await sb.auth.signOut(); location.href = '/'; });
    if (EMB) { var li = $('#btnLogout').closest('li'); if (li) li.style.display = 'none'; var hr = $('.dropdown-divider'); if (hr) hr.closest('li').style.display = 'none'; }
    addEventListener('hashchange', route);
  }

  /* ---------- boot ---------- */
  function message(html) { document.body.innerHTML = '<div class="container py-5" style="max-width:560px"><div class="stat-card"><p class="mb-0">' + html + '</p></div></div>'; }
  async function boot() {
    if (!window.supabase || !window.bootstrap) return message('Could not load online components. Check the internet connection and refresh.');
    sb = makeClient();
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return message('Please sign in to the TAC East Legon admin first, then open the Asset Register from the admin. <a href="/">Go to the admin</a>');
    $('#appRoot').innerHTML = $('#tpl-app').innerHTML; $('#sharedRoot').innerHTML = $('#tpl-shared').innerHTML;
    $('#adminEmail').textContent = (s.user && s.user.email) || 'admin';
    try { await load(); } catch (e) {
      var m = (e && e.message) || '';
      return message('The asset register could not load: ' + esc(m) + '. Run <b>23-asset-inventory.sql</b> in Supabase, then add <b>inv</b> to Settings, API, Exposed schemas (keep public first).');
    }
    document.body.classList.add('is-admin');
    wire(); render(); route();
  }
  boot();
})();

</script>
</body></html>
