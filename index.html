<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0D2660" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TAC-EL" />
    <title>The Apostolic Church Ghana East Legon Assembly</title>
    <meta name="description" content="The official digital portal for The Apostolic Church Ghana East Legon Assembly, featuring real-time church news, sermon library, event schedules, and ministry management." />
    <meta property="og:title" content="The Apostolic Church Ghana East Legon Assembly" />
    <meta property="og:description" content="The official digital portal for The Apostolic Church Ghana East Legon Assembly, featuring real-time church news, sermon library, event schedules, and ministry management." />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // If the app fails before it can draw anything, show why instead of a blank page.
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (!root || root.hasChildNodes()) return;
          var box = document.createElement('div');
          box.style.cssText = 'min-height:100vh;background:#0b1f4d;color:#fff;font-family:system-ui,sans-serif;padding:32px 20px';
          var h = document.createElement('h1'); h.style.cssText = 'font-size:20px;margin:0 0 8px'; h.textContent = 'The app could not start';
          var p = document.createElement('pre'); p.style.cssText = 'background:rgba(255,255,255,.08);padding:14px;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-word';
          p.textContent = msg + '\n\nPress F12 and open the Console tab for more details, then send this to the developer.';
          box.appendChild(h); box.appendChild(p); root.appendChild(box);
        }
        window.addEventListener('error', function (e) { show(e.message || 'Unknown error'); });
        window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () { show('The app did not start within 8 seconds.'); }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
